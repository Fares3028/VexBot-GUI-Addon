name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
     - name: Upload mod jar
  uses: actions/upload-artifact@v4
  with:
    name: vexbot-gui-jar
    path: |
      v8/build/libs/*.jar
      !v8/build/libs/*-sources.jar
      !v8/build/libs/*-dev.jar
